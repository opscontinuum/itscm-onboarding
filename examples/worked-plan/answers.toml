[facts."infra.silent_failures"]
status = "ANSWERED"
value = "The reference plan carries a catalog of them and says why: an environment that is not monitored is not a DR environment, it is an assumption. Data Guard apply can stop while transport keeps running, so the standby falls arbitrarily far behind while the console still looks connected. The configuration can fall unsynchronized, at which point recovery point zero stops being true and fast-start failover can no longer occur, so the local automatic-failover story stops working in exactly the case tier 0 exists for. Volume group replication can stall silently, leaving the replica frozen at an old point in time that is discovered only at failover. File storage replication can miss its interval repeatedly and leave files hours or days stale. The in-guest agent that runs every orchestrated step can stop on a Windows node, so every user-defined step fails mid plan. Backup protection can fail to be re-enabled on the new primary after a role change, so the region that is now primary is not being backed up at all. The fast recovery area can fill, which stalls apply and fails drills. The Phoenix cluster can be scaled to zero cores by a cost-cutting change, which stops redo apply and silently turns tier 1 into tier 3 while the documentation still claims the old recovery point. And configuration can drift between the regions, so failover succeeds and the application misbehaves. The governing rule the plan draws from this is to alarm on the absence of signal and not only on bad values, because several of these show up as silence rather than as a bad number."
provenance = "document:oci-itscp/docs/04-monitoring.md"
confidence = "high"
notes = "One alarm in the catalog has no metric behind it: the plan records that no monitoring metric exists for object storage replication and that its status has to be polled instead. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

