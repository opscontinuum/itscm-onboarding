# Often the single largest RTO lever, and cheaper than more capacity.
# Read this back and get a yes before recording it.
[facts."infra.region_locked_naming"]
status = "ANSWERED"
value = "The design deliberately removes the region lock, and the reference plan calls that the single biggest recovery-time lever in the document. Physical computer names are unique per region and per availability domain, each machine a distinct directory account. EBS itself is configured with logical host names that are the same in both regions and resolved region-locally, through a hosts file or a region-scoped private DNS view, so that context files, FND_NODES, WebLogic configuration and profile options do not change at failover. TNS aliases resolve region-locally for the same reason, so the service access names differ per region and Data Guard needs no shared names. The two virtual networks must use different address ranges, because both have to be routable at once for Data Guard. Drill instances get the same logical names in a drill-only resolution view, and the plan warns that without that view a drill silently falls into the slow rebuild branch."
