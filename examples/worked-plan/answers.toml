# infra.post_recovery_backup - asked of the infrastructure owner
# The step most likely to be missed, because the system is up and everyone goes home.
# Until this is done a second event is unrecoverable, so the answer needs a name and a
# time attached to it, not an intention.
# Read this back and get a yes before recording it.
[facts."infra.post_recovery_backup"]
status = "ANSWERED"
value = "Nothing protects the recovered system until somebody turns protection on, and the reference plan says so in as many words: this is the step most likely to be missed, because Ashburn's protection was the recovery service and Phoenix as primary is a different posture that does not inherit it. Backups are disabled on the new standby after any role change, and the failover runbook carries an explicit step to enable the recovery service on the new primary, warning that backups are not running there until somebody does. An alarm covers it: the protected-database status is checked, and a non-healthy status or no backup in twenty-six hours pages the DBA on-call. The database team owns re-protection, meaning a new standby and a fresh backup, and the plan's exit checklist will not close until a fresh full backup of the current primary exists in whatever region is now primary and a standby exists again inside the tier recovery point. No deadline in hours is stated for that first backup; the twenty-six hour figure is a monitoring threshold rather than a target."
provenance = "document:oci-itscp/docs/10-phase-reconstitution.md"
confidence = "high"
notes = "The conflict recorded here is the reference plan's own, between two Oracle sources it cites. It picks the release note's reading and marks the design that follows from the choice as unverified engineering judgment, so the disagreement is surfaced rather than settled. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

[facts."infra.post_recovery_backup".conflict]
value = "Automatic backups may be enabled on a database holding the standby role in a Data Guard association, so the Phoenix standby could be backed up directly."
provenance = "document:oci-itscp/docs/03-replication-matrix.md"
decision_owner = "infrastructure owner"
notes = "The Exadata service documentation permits automatic backups on a standby-role database in general; the release note the plan follows permits them only when the primary's backup destination is Object Storage, which it is not here. The plan resolves this by scheduling a customer-run RMAN backup of the standby instead, and marks that design unverified."

