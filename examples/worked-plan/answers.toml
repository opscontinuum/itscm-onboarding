[[facts."infra.irreversible_choices".value]]
decision = "Disable Volume Group Replication to save the replica storage line"
cost_to_reverse = "Disabling deletes the replica, and re-enabling starts the replication process from scratch with an initial sync that can take hours. The cheapest line item is traded for a multi-hour unprotected window"
who_may_take_it = "Nobody. The posture tooling refuses it outright"

[[facts."infra.irreversible_choices".value]]
decision = "Export a File Storage replication target to make it writable at failover"
cost_to_reverse = "Once a target has been exported, re-establishing replication requires a full base copy; a target that was never exported can be reused without one"
who_may_take_it = "The failover runbook, and only with an explicit confirmation flag and a change or incident ticket"

[[facts."infra.irreversible_choices".value]]
decision = "Delete the source Object Storage replication policy"
cost_to_reverse = "A new policy does not replicate objects that already exist in the source bucket, so a bulk copy has to run before the reverse policy. Deleting the source policy is permanent"
who_may_take_it = "The failover runbook, and only with an explicit confirmation flag and a change or incident ticket"

[[facts."infra.irreversible_choices".value]]
decision = "Execute a cross-region failover to Phoenix"
cost_to_reverse = "There is no fast undo. The return trip is a project-managed failback measured in days to weeks, mostly waiting on full baseline copies of every storage tier"
who_may_take_it = "The DR Commander, under the delegation in the authority matrix, without waiting for the change advisory board"

[[facts."infra.irreversible_choices".value]]
decision = "Scale the Phoenix Exadata VM cluster to zero cores to save money"
cost_to_reverse = "Redo apply stops. Tier 1 silently becomes tier 3 while the documentation still claims the old recovery point"
