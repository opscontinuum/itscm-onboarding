# continuity.decision_time_budget - asked of the DR process owner
# Deciding is on the recovery critical path and is almost never budgeted. Whatever the
# number is, it comes out of the MTD.
# The figure needs its mechanism beside it. Ask:
# What is happening to the outage while that decision is being taken, and what stops
# being recoverable once the budget is spent?
[facts."continuity.decision_time_budget"]
status = "ANSWERED"
value = 10
mechanism = "Ten minutes end to end, phased: reachability triage in the first minute, evidence capture running in parallel through minute four, blast radius from two to six, the estimate with a confidence band from five to eight, and the hand-off to the DR Commander and the gate decision from eight to ten. What is happening to the outage meanwhile is that the budget is being spent at a known rate against an unknown duration, and the clock does not stop while succession runs, so ten minutes spent failing to reach the Commander is ten minutes of the tolerable downtime. Overrunning the budget is itself an input: if no estimate exists by minute eight, the estimate is unknown and the unknown rule applies."
provenance = "document:oci-itscp/checklists/outage-assessment.md"
confidence = "medium"
notes = "The reference plan records the budget and the placement of the assessment inside the gate as its own engineering judgment derived from the gate, and notes that NIST requires only that assessment be completed as quickly as conditions permit. Confidence is medium for that reason: it is stated plainly and it is a choice, not a measurement."

