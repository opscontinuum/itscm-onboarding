# app.start_order - asked of the lead engineer
# Rarely written down, usually in one person's head. Capture verbatim. If only one
# engineer holds it, that is a deputy gap as well as a documentation gap.
# Read this back and get a yes before recording it.
[facts."app.start_order"]
status = "ANSWERED"
value = "The order is fixed by dependency rather than preference and both runbooks execute it the same way. Quiesce the application tier first, Concurrent Managers before anything else, because an in-flight concurrent request writing during a role transition is the hardest class of damage to reason about afterwards: stopping the writers precedes stopping the readers. Capture forensics next on an unplanned event, because evidence is destroyed by recovery. Then transition the database, because everything downstream needs a writable database with a known system change number. Then activate storage, block first, then file, then object, because the application tier mounts these, and because activating a volume group replica takes its last synced point and activating before it has caught up silently strands writes. Then scale the standby Exadata off its OCPU floor, because redo apply at the floor is not the same workload as serving production. Then start compute and then EBS. Steer traffic last, so that no user reaches a half-built stack. Work recovery runs in parallel with the last two steps rather than after them. Within the application tier: attach and mount storage and verify fs1, fs2 and fs_ne are all present before touching EBS; run cmclean with all managers down; start EBS services; start Concurrent Managers last, after web and forms are confirmed healthy; then verify that FND_NODES matches the running logical host names."
provenance = "document:oci-itscp/docs/09-phase-recovery.md"
confidence = "high"
notes = "No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

