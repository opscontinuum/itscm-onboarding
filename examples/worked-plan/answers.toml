# governance.event_documentation - asked of the governance/risk contact
# A drill report and an event report are different documents and most organizations
# have neither. Ask the last part plainly: if it has never been done, the answer is
# what the plan should say, not an intention dressed as a procedure.
# Read this back and get a yes before recording it.
[facts."governance.event_documentation"]
status = "ANSWERED"
value = "It has never been done, and the reference plan states plainly that it could not be. There is no after-action report template. The standard asks for one explicitly, and the repository has the inputs, the drill timing sheet, the recovery-point attestation script, the replication-state capture and the evidence directory, but no document that assembles them into a report and no defined route from a finding to a plan change beyond the record of changes. The drill runbook covers evidence and improvement for a drill; a real event is not covered. Where the record would go is stated, the timing sheet, replication-state capture and after-action narrative to the evidence directory with the record of changes updated with what the event taught, and both are exit-checklist items. Who writes it for a real event is not stated in the reference plan, beyond the assessment team contributing to the after-action record and risk and audit receiving the evidence. The record of changes carries no row for a drill or an event."
provenance = "document:oci-itscp/docs/10-phase-reconstitution.md"
confidence = "high"
notes = "This is the answer the field's own guidance asks for: where it has never been done, the answer is what the plan should say rather than an intention dressed as a procedure. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# governance.associated_plans - asked of the governance/risk contact
# A continuity plan that assumes a facilities plan exists, and a facilities plan that
# assumes this one does, is a pair of documents each waiting for the other. Naming the
# owner is what makes the assumption checkable.
[facts."governance.associated_plans"]
status = "MISSING"
owner = "governance/risk contact"
notes = "The reference plan names escalation destinations outside itself, security incident response, Legal, Communications and the cloud account team, and cites a cybersecurity event recovery guide in its standards crosswalk. It has no section listing the plans this one leans on or feeds into, and names no owner for any of them. A continuity plan assuming a facilities plan exists, and a facilities plan assuming this one does, is the pair of documents this field is meant to catch."

# governance.drill_cadence - asked of the governance/risk contact
# Two questions in one and the second is the real one. A stricter cadence than the
# organization will fund is worse than an honest looser one, because the plan then
# documents a control that does not run and an auditor will find the gap rather than
# the intention.
# The figure needs its mechanism beside it. Ask:
# What would have to happen for one to be skipped, and who notices when it is?
[facts."governance.drill_cadence"]
status = "MISSING"
owner = "governance/risk contact"
notes = "The reference plan states a cadence: quarterly at minimum, monthly for tier 0. It records nothing about what would have to happen for one to be skipped or who notices when it is, so the figure arrives without the mechanism this field requires. The plan's training checklist independently observes that the drill evidence list records no attendance and no per-person outcome, so no record exists that any named role holder was trained in any given year."

# governance.drill_levels - asked of the governance/risk contact
# The last column is the one that gets argued about, which is why it is a column. An
# organization whose only evidence is a reading has a plan nobody has run, and it will
# believe otherwise until this table is filled in.
[facts."governance.drill_levels"]
status = "ANSWERED"
provenance = "document:oci-itscp/runbooks/RB-04-dr-drill.md"
confidence = "high"
notes = "The reference plan states what each level proves and, apart from the two observations recorded above, does not state what any level leaves unproven, which is the column its own standards alignment says gets argued about. Its separate test-environment tiers do carry an explicit say and do-not-say table, but those are substrates for testing the toolkit rather than drill levels. Escalation is ordered: do not attempt level 3 until levels 1 and 2 are routine."

[[facts."governance.drill_levels".value]]
level = "1, component test, using the orchestration prechecks and the replication health script, with no production impact"
what_it_proves = "Replication is healthy, prechecks pass, the in-guest agent is alive, and, empirically the first time it is run, what the built-in Exadata drill plan group actually does"
what_it_does_not_prove = "It exercises no recovery role, so it satisfies no training requirement. Beyond that, not stated in the reference plan"

[[facts."governance.drill_levels".value]]
level = "2, snapshot standby drill, using a Data Guard snapshot standby with the start-drill and stop-drill plans, with no production impact"
what_it_proves = "The full EBS stack opens read-write in Phoenix, the application tier starts and transactions commit. This is the drill that produces a real measured tolerable downtime without an outage, and the plan calls it the workhorse"
what_it_does_not_prove = "It is run with the runbook open, so it never satisfies the closed-book training standard. While it runs, the always-on BI node reads a snapshot standby that is receiving redo without applying it, so it proves the presentation tier survives a role change and not that the standby is current"

[[facts."governance.drill_levels".value]]
level = "3, live switchover, running the switchover runbook against real production, with a planned outage"
what_it_proves = "Everything, including DNS, users and partner integrations"
what_it_does_not_prove = "not stated in the reference plan"

# governance.availability_boundary - asked of the governance/risk contact
# The boundary most plans raise against themselves and never close. Where it is the
# same person, ask what they stop doing during a recovery; where it is two, ask who
# decides which one a given incident is.
# Read this back and get a yes before recording it.
[facts."governance.availability_boundary"]
status = "MISSING"
owner = "governance/risk contact"
notes = "The reference plan records this as gap G4 against itself: no explicit availability versus continuity boundary. It knows where the line would fall, that the same-region synchronous standby with automatic failover is an availability control and the cross-region leg with the runbooks is continuity, and it says this split already exists in the design and needs naming. It has not been written into the architecture document, no availability owner is named, and no availability targets exist anywhere because the plan says they belong in a separate service-level document."

# governance.plan_custody - asked of the signing authority
# A plan readable only from the system it recovers is a plan nobody can read when they
# need it. The second half of the question is the whole question; ask it separately
# and wait.
# Read this back and get a yes before recording it.
[facts."governance.plan_custody"]
status = "ANSWERED"
value = "The signed statement is evidence and carries the same handling rules as the rest of the evidence directory. In a private fork it is kept alongside the drill output it cites, and the approved commit or tag is recorded, so that the plan that was approved is a specific checkable revision rather than whatever the main branch happens to be today. For the second half of the question the plan states the requirement clearly but not for this document: the runbooks must be accessible from outside the primary region and the roster must be held outside it, printed, with the DR Commander and the deputy and in the standby-side runbook store, and the plan says plainly that a runbook living on a wiki hosted in the region being recovered is not a runbook. The same instruction is not given for the signed approval statement itself, and no out-of-region location for it is named. The record of changes gives the reason the question matters here: the plan is read during an outage as a standalone document, often printed, when the repository may be exactly what is unreachable."
provenance = "document:oci-itscp/docs/00-plan-approval.md"
confidence = "medium"
notes = "Confidence is medium because the offsite-copy requirement the second half of this question asks about is written for the runbooks and the roster and not for the signed plan. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

