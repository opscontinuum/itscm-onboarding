# continuity.assessment_procedure - asked of the DR process owner
# Where the repair estimate the activation criteria consume comes from.
# Read this back and get a yes before recording it.
[facts."continuity.assessment_procedure"]
status = "ANSWERED"
value = "The assessment team, led by infrastructure on-call, produces exactly one number: the estimated time to restore service in Ashburn. The failover gate compares that number against the remaining tolerable downtime and the comparison decides whether a disaster is declared. Four steps. First, establish reachability and role state using the Data Guard and replication health scripts. Second, capture evidence, and the plan says to run this even if you expect not to declare, because recovery destroys it. Third, establish the blast radius: is this the database, the availability domain, or the region? Fourth, produce the estimate, which for a regional event means asking the cloud operator, because their own estimate is the only credible input to a repair time, and writing down what was said and when, because an estimate with no timestamp is worthless twenty minutes later. The output form is fixed: give a band and a confidence, never a point estimate, because a point estimate implies a precision nobody has and invites the Commander to treat it as fact. Safety takes precedence over the procedure: an assessor in a disrupted location is not an assessor, and passes to their alternate saying why. The plan carries a closed-book fallback of five questions for when the document is not to hand."
provenance = "document:oci-itscp/checklists/outage-assessment.md"
confidence = "high"
notes = "No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# continuity.escalation_thresholds - asked of the DR process owner
# Observable at 3am by a tired person. 'When it feels wrong' is not one.
# Read this back and get a yes before recording it.
[facts."continuity.escalation_thresholds"]
status = "ANSWERED"
value = "Four triggers, each tied to something observable. Any numbered recovery step exceeding twice its drill-measured duration, or the elapsed total passing half the tier's tolerable downtime: escalate to the declaring authority, re-forecast against what remains, and consider the failover runbook's branches. A key step completing, meaning the database transitioned, traffic steered, or service declared: status to the bridge and to the business owner. Standby capacity proving insufficient, whether core scaling is blocked or Phoenix shape capacity is unavailable: escalate to the cloud account team. And measured data loss exceeding the tier's recovery point, which leaves the runbook altogether and becomes a business decision. Beyond those, a suspected cyber cause, regulatory exposure or media interest escalates to security incident response, Legal and Communications."
provenance = "document:oci-itscp/docs/09-phase-recovery.md"
confidence = "low"
notes = "Confidence is low because the reference plan says so: the thresholds are its own engineering judgment, NIST requires thresholds to be defined but specifies no values, and none have been calibrated against a completed drill. The first threshold is worse than uncalibrated, it is unusable: twice the drill-measured duration of a step presumes a drill, and no drill has been run. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# continuity.deactivation_authority - asked of the DR process owner
# Declaration and deactivation are a matched pair.
# Read this back and get a yes before recording it.
[facts."continuity.deactivation_authority"]
status = "ANSWERED"
value = "The same authority that declared the disaster announces the deactivation, to the same list that was notified at activation, because declaration and deactivation are a matched pair and an unclosed declaration leaves the organization unsure whether it is still in one. What they have to see is a ten-item exit checklist, all of it true: the recovery-point attestation filed; the functional team's signature on the validation pack; users, business owner and partners notified; drill and temporary resources torn down and the posture returned to steady state; a standby existing again with its lag inside the tier recovery point; a fresh full backup of the current primary in whatever region is now primary; the protection groups re-pointed and their plans re-validated; the timing sheet and after-action narrative written to evidence; the record of changes updated with what the event taught; and the announcement itself. Anything unticked is an open disaster, whatever the dashboards say. Deactivating does not require being back in Ashburn; it requires being protected wherever you are."
provenance = "document:oci-itscp/docs/10-phase-reconstitution.md"
confidence = "high"
notes = "No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
