# continuity.activation_criteria - asked of the DR process owner
# Comparisons against something knowable at 3am, not feelings.
# Read this back and get a yes before recording it.
[facts."continuity.activation_criteria"]
status = "ANSWERED"
value = "Four observable questions inside a ten-minute gate, and the plan treats not activating as a first-class outcome. Is the primary database reachable and openable? If it is, this is not a failover, and the answer is to troubleshoot in place. Is a drill in progress? Did the local fast-start failover already promote the in-region standby, and if it did, is the second availability domain's application tier serving requests? Is the whole Ashburn region or the Exadata infrastructure lost? And finally, is the estimated repair time greater than the maximum tolerable downtime minus the time already spent on this gate minus the roughly sixty-minute failover recovery time? If it is, declare and execute the failover plan. The plan is emphatic that the fourth threshold is dynamic rather than the flat two-hour tier 0 figure, and that declaring late burns the margin a cross-region failover needs to land inside the tolerable downtime at all."
