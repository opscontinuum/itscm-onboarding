# continuity.people_unavailable - asked of the DR process owner
# Almost never asked and almost never has an answer. 'Nobody' is the correct answer
# where it is true, and it belongs in the plan as a named hole rather than being
# filled in by whoever is drafting.
# Read this back and get a yes before recording it.
[facts."continuity.people_unavailable"]
status = "MISSING"
owner = "DR process owner"
notes = "The reference plan asks this question of itself and records that it has no answer. It names two cases the environment should have an answer for and calls both currently unanswered: geographic concentration of the recovery teams, and out-of-region personnel who could execute a failover. Both are marked to be resolved rather than assumed, which is the right treatment and leaves the field genuinely empty."

# continuity.assessment_calibration - asked of the DR process owner
# Calibrates the assessment budget against what this organization can do rather than
# against what the plan would like. If the honest answer is two hours, a ten-minute
# assessment step is fiction and the plan should say so.
# The figure needs its mechanism beside it. Ask:
# What were they waiting on for that long, and is that thing any faster now?
[facts."continuity.assessment_calibration"]
status = "MISSING"
owner = "DR process owner"
notes = "The reference plan carries a target of three minutes for producing the estimate, inside a ten-minute gate, and states that its blast-radius bands are indicative durations rather than measurements which become credible only once a drill has timed the corresponding paths. It records no observation of how long this organization actually took to produce a repair estimate, because no incident and no drill has happened. The field records a measured figure and there is none."

# continuity.declaration_threshold_rule - asked of the DR process owner
# The default action when nobody can estimate is a separate field and this is the rule
# behind it. A fixed threshold ages badly; one computed from what is left of the
# budget survives a change to the tier. Ask which they want and write down why.
# Read this back and get a yes before recording it.
[facts."continuity.declaration_threshold_rule"]
status = "ANSWERED"
value = "Computed from what is left of the budget, explicitly not a fixed number of hours. The rule is that estimated repair time greater than the remaining tolerable downtime means declare, where remaining means the tier's tolerable downtime minus the time already elapsed on the gate minus the roughly sixty-minute failover recovery time, and not a flat two-hour figure. The plan states the counterpart out loud, that the gate exists to be used and that one should not wait for certainty, and it requires the DR Commander to be able to state the rule from memory in a closed-book assessment."
provenance = "document:oci-itscp/checklists/dr-authority-matrix.md"
confidence = "high"
notes = "No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# continuity.data_loss_gate - asked of the DR process owner
# Decide it in daylight. In the event this is asked of whoever is nearest, at speed,
# and the wrong answer pays somebody twice or fails to pay them at all. Name who
# clears it.
# Read this back and get a yes before recording it.
[facts."continuity.data_loss_gate"]
status = "ANSWERED"
value = "Downstream processing stays stopped. If the recovery point is breached the Concurrent Managers stay down until Finance clears them, because automated batch processing on incomplete data is far harder to unwind than a longer outage. The decision to proceed when data loss exceeds the tier recovery point belongs to the business owner together with the CFO delegate and their involvement is mandatory. Finance convenes before any batch processing runs, and clearing the Concurrent Managers is a Finance duty rather than a DBA or functional one, though the EBS functional lead is the role that actually starts them, last, and not at all after a breach until Finance has cleared it. The rule appears in four separate documents including both closed-book role cards, which is what makes it a decision taken in daylight rather than at speed."
provenance = "document:oci-itscp/checklists/dr-authority-matrix.md"
confidence = "high"
notes = "No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# continuity.recovery_declaration - asked of the DR process owner
# Distinct from standing the plan down. This is the moment users are told they may
# work, and the evidence for it is the validation pack rather than the infrastructure
# being green.
# Read this back and get a yes before recording it.
[facts."continuity.recovery_declaration"]
status = "ANSWERED"
value = "The reference plan has two moments where this plan's question expects one, and it does not name a speaker for the first. Service is declared available to users once the validation pack passes, at which point the plan is explicit that the system is functional and not validated, because validation belongs to reconstitution. Later the business owner accepts service restoration, the functional team signs the validation pack and the DBA does not, and the declaring authority announces deactivation. The evidence required is the validation pack, the recovery-point attestation, and the data-loss statement produced during the failover. Who tells the business at the first moment is not stated in the reference plan."
provenance = "document:oci-itscp/docs/10-phase-reconstitution.md"
confidence = "medium"
notes = "The plan is emphatic on the substance behind this field even where it leaves the speaker unnamed: the database opening read-write is not validation, and the only person who can say a business process is correct is somebody who runs it. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# continuity.user_notification - asked of the DR process owner
# Ask what the message has to say, not just who sends it. Users coming back to a
# system that lost fifteen minutes of work need to be told that, and a channel that
# runs through the recovered environment is a channel with a loop in it.
# Read this back and get a yes before recording it.
[facts."continuity.user_notification"]
status = "ANSWERED"
value = "A service-restored notice goes to users, the business owner, and every interconnected partner who was told during activation, sent through the call tree and partner contact lists rather than through the recovered environment, and the exit checklist will not close until it has gone. What the message has to carry is not stated in the reference plan: the reference plan has a what-to-say table and it belongs to the activation notification, covering the nature of the outage, the repair estimate, the runbook step and the bridge details. There is no restoration template, nobody is named as drafting it, and the warning about possibly duplicated workflow notifications appears only as a work-recovery task and not as something the restoration message must repeat to users."
provenance = "document:oci-itscp/docs/10-phase-reconstitution.md"
confidence = "medium"
notes = "No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# continuity.cleanup - asked of the DR process owner
# The second half of the question finds the expensive one. Ask also what must
# deliberately not be torn down: the replication that was rebuilt is the thing most
# often cleaned up by somebody tidying.
# Read this back and get a yes before recording it.
[facts."continuity.cleanup"]
status = "ANSWERED"
value = "Tear down drill-only resources, release the activated volume-group clones, retire the temporary DNS answers, and return the posture to steady state, which for Phoenix compute means back to pilot light. The DR Coordinator owns the exit checklist, the application tier team carries drift reconciliation and cleanup, and the network team retires the temporary answers. Nothing is returned physically: there is no media, backups sit in the recovery service and Object Storage, and the plan marks offsite media return as not applicable rather than leaving it blank. The thing that must deliberately not be torn down is replication, and the plan's governing rule says exactly that: tear down compute, never tear down replication. The exit checklist will not close until a standby exists again with its lag inside the tier recovery point."
provenance = "document:oci-itscp/docs/10-phase-reconstitution.md"
confidence = "high"
notes = "No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# governance.signing_authority - asked of the signing authority
# The signatory and the alternate signatory. A plan that can only be approved by one
# reachable person cannot be reapproved after a material change while they are away.
# Read this back and get a yes before recording it.
[facts."governance.signing_authority"]
status = "ANSWERED"
value = "The designated authority, who in this plan is the same person as the DR Commander and the plan's director, signs, and that signature is the one the standard requires. The plan adds the business owner, the CIO and the risk function as other applicable approving signatures and instructs a reader not to remove the first one. In this repository the statement is deliberately left unsigned and every signatory is a placeholder, which the plan says is the point of the warning at the top rather than an oversight. Who signs when the designated authority is away is not stated in the reference plan: the ordered succession in the roles document covers declaration authority during an incident, not approval of the plan, and the plan notes separately that approval does not transfer with the job title when the designated authority changes."
provenance = "document:oci-itscp/docs/00-plan-approval.md"
confidence = "high"
notes = "No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# governance.review_cadence - asked of the governance/risk contact
# Frequency AND triggers AND an owner. An unowned cadence does not happen.
[facts."governance.review_cadence"]
status = "ANSWERED"
value = "Annually, at the same time as the tier-assignment workshop is re-run, and owned by the plan's director, who is the DR Commander and owns the annual review. Six triggers require re-signing rather than re-dating: any material assumption changing; any tier assignment changing; a drill failing to meet a tier's tolerable downtime where the finding is closed by changing the plan rather than the environment; after a real invocation and the subsequent failback; and the designated authority changing. The plan is careful about the limit of this: those triggers cover re-approval of the statement, which is one part of its own gap G3, and the plan-maintenance section that gap asks for is still open. Its record of changes says the same thing, that a review finding nothing to change produces no row and a row does not evidence that a review took place. Separate cadences do exist for testing, quarterly at minimum and monthly for tier 0, and for the roster, rung monthly with a row unanswered for ninety days treated as unreachable."
provenance = "document:oci-itscp/docs/00-plan-approval.md"
confidence = "medium"
notes = "Confidence is medium because the reference plan records the answer as partial against its own gap G3, which is still open."

# governance.training_program - asked of the governance/risk contact
# Distinct from drills. Drills exercise the plan; training makes individuals
# competent. Auditors check for both.
# Read this back and get a yes before recording it.
[facts."governance.training_program"]
status = "ANSWERED"
value = "A program distinct from the drill program, and the plan says why: the drill evidences that the plan survives losing a person, not that a person survives losing the plan, and a drill is run with the runbook open and should be. The standard it sets is that a role holder can act for the first few hours without the document. Six modules: purpose, scope and tiers; roles, authority and the decision gate; coordination, communication and reporting; security requirements during recovery and drills; team-specific processes; and an assessed simulated event. Four audiences take different subsets: decision, technical, business and awareness. Every role holder, primary and deputy, retakes their subset within twelve months of last completion and never later than twelve months after appointment, with an additional briefing within thirty days of any material plan change, and a syllabus review annually, after every drill's lessons-learned session, after any invocation and on any audit finding. New joiners complete the path within thirty calendar days of appointment and before their first on-call shift or first sole holding of the role, whichever comes first, and until then they are in training, may shadow, and a trained primary or deputy stays reachable. Assessment is closed book: the trainee answers with nothing open and each item is scored unprompted, prompted or missed; every item unprompted is a pass, one prompted is a pass with a re-check at the next quarterly drill, and any missed item or two prompted is a fail and a repeat within fourteen days. Drill participation never discharges the new-joiner path."
provenance = "document:oci-itscp/checklists/contingency-training.md"
confidence = "high"
notes = "The reference plan records its own intervals, the twelve-month refresher, the thirty-day new-joiner deadline, the thirty-day briefing window and the fourteen-day re-test, as organization-defined values for assignments the standard leaves open, and states that no source prescribes them. The training register itself is not populated in the example repository. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

# governance.finding_to_change_route - asked of the governance/risk contact
# If there is no route, the drills are theater.
# Read this back and get a yes before recording it.
[facts."governance.finding_to_change_route"]
status = "ANSWERED"
value = "For a drill there is a route and the plan states it: the drill produces a defect list with owners and due dates, and the measured recovery and work-recovery numbers are committed back over the design targets in the tier document, which the plan calls what turns this from a document into a program. Every commit that changes plan content adds a row to the record of changes in the same commit, because a change without a row is a change the printed plan does not know about. A drill failure that is closed by changing the plan rather than the environment triggers re-approval. The risk and audit function receives the evidence and owns the plan-change route. For a real event there is no route, and the plan says so: it has no after-action report template, and records that there is no defined route from a finding to a plan change beyond the record of changes itself. No register of open findings exists."
provenance = "document:oci-itscp/runbooks/RB-04-dr-drill.md"
confidence = "medium"
notes = "Confidence is medium because the reference plan answers this for drills and records the equivalent for a real event as a known gap in the same revision. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."
readback = "confirmed"

