# infra.shared_storage - asked of the infrastructure owner
# This decides a real fork in the recovery design and is usually answered by whoever
# is in the room rather than by whoever knows. Ask for the protocol, not the product.
# Read this back and get a yes before recording it.
[facts."infra.shared_storage"]
status = "ANSWERED"
value = "Less than a reader would expect, and the plan is explicit about why. EBS 12.2 on Windows has no shared application-tier file system, so the run, patch and non-editioned filesystems live on each node's own replicated block volumes rather than on a share, and the replicated copy is the Phoenix application tier. What is genuinely shared is the inbound and outbound interface landing directories that every application node must see, custom file drops written by integrations such as bank files, EDI and scanned documents, and the concurrent output archive if one is kept on a share rather than per node. Those are reached over NFS version 3, which is the protocol the File Storage service supports, using the Windows client for NFS with anonymous user and group mapping. The plan records that whether that configuration is EBS-certified for Windows was not found in any source it read."
