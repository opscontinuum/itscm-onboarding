<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Timeline showing the recovery point objective before the incident, then recovery time and work recovery time after it, with maximum tolerable downtime spanning both">
  <style>
  .bg   { fill: #ffffff; }
  .txt  { fill: #1a1a1a; font-family: ui-sans-serif, Helvetica, Arial, sans-serif; }
  .mut  { fill: #5c6470; font-family: ui-sans-serif, Helvetica, Arial, sans-serif; }
  .grid { stroke: #c2c8d0; }
  .ttl  { font-size: 15px; font-weight: 700; }
  .nm   { font-size: 13.5px; font-weight: 700; }
  .sub  { font-size: 11px; }
  .val  { font-size: 12.5px; font-weight: 700; }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="330"/>
  <text class="txt ttl" x="24" y="30">Maximum tolerable downtime is recovery time plus work recovery time</text>
