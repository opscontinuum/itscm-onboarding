answer = "Each box calls the boxes below it and only those; nobody telephones the whole roster. The first responder, infrastructure or DBA on-call, detects and escalates to the DR Commander, who runs the decision gate and declares, with the Deputy taking the tree if the Commander is unreachable. The Commander then calls the DR Coordinator as technical execution lead and the business owner, who is consulted within fifteen minutes and not waited for beyond it. The Coordinator calls the Infra Manager, the DBA on-call and the EBS functional lead. The Infra Manager calls infrastructure on-call, network on-call and FinOps, who are notified rather than consulted. The DBA calls a second DBA and Oracle Support at severity one. The functional lead calls their alternate and the interface partner contacts. The business owner calls the CFO delegate, mandatory during period close or after a recovery-point breach, and Risk. When somebody does not pick up: try cell, then work, then home, leaving a voicemail at each that states the bridge details and that this is a DR notification and nothing more. Move on after five minutes without a spoken or typed acknowledgement and ring the alternate, who then holds the position for the duration rather than handing it back mid-runbook. If both primary and alternate are silent after ten minutes the branch collapses upward: the caller takes over that box's list, continues down the tree, and tells the Commander which position is unfilled. Email and chat do not count as reached, because there is no way to ensure receipt and acknowledgement. Log every attempt with time, number tried and outcome."
