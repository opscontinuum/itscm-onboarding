question_id = "governance.review_cadence"
prompt = "How often does this get reviewed, what else triggers a review, and whose job is it to start one?"
answer = "Annually, at the same time as the tier-assignment workshop is re-run, and owned by the plan's director, who is the DR Commander and owns the annual review. Six triggers require re-signing rather than re-dating: any material assumption changing; any tier assignment changing; a drill failing to meet a tier's tolerable downtime where the finding is closed by changing the plan rather than the estate; after a real invocation and the subsequent failback; and the designated authority changing. The plan is careful about the limit of this: those triggers cover re-approval of the statement, which is one part of its own gap G3, and the plan-maintenance section that gap asks for is still open. Its record of changes says the same thing, that a review finding nothing to change produces no row and a row does not evidence that a review took place. Separate cadences do exist for testing, quarterly at minimum and monthly for tier 0, and for the roster, rung monthly with a row unanswered for ninety days treated as unreachable."
mutation = "governance.review_cadence ANSWERED confidence=medium provenance=document:oci-itscp/docs/00-plan-approval.md"
notes = "Confidence is medium because the reference plan records the answer as partial against its own gap G3, which is still open."

[[entries]]
