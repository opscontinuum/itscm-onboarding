prompt = "Who works out how bad it is, and how do they produce a repair estimate the person declaring can act on?"
answer = "The assessment team, led by infrastructure on-call, produces exactly one number: the estimated time to restore service in Ashburn. The failover gate compares that number against the remaining tolerable downtime and the comparison decides whether a disaster is declared. Four steps. First, establish reachability and role state using the Data Guard and replication health scripts. Second, capture evidence, and the plan says to run this even if you expect not to declare, because recovery destroys it. Third, establish the blast radius: is this the database, the availability domain, or the region? Fourth, produce the estimate, which for a regional event means asking the cloud operator, because their own estimate is the only credible input to a repair time, and writing down what was said and when, because an estimate with no timestamp is worthless twenty minutes later. The output form is fixed: give a band and a confidence, never a point estimate, because a point estimate implies a precision nobody has and invites the Commander to treat it as fact. Safety takes precedence over the procedure: an assessor in a disrupted location is not an assessor, and passes to their alternate saying why. The plan carries a closed-book fallback of five questions for when the document is not to hand."
