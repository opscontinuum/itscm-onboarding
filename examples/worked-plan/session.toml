question_id = "governance.training_programme"
prompt = "Separately from drills: how does someone new become competent to do their part of this?"
answer = "A programme distinct from the drill programme, and the plan says why: the drill evidences that the plan survives losing a person, not that a person survives losing the plan, and a drill is run with the runbook open and should be. The standard it sets is that a role holder can act for the first few hours without the document. Six modules: purpose, scope and tiers; roles, authority and the decision gate; coordination, communication and reporting; security requirements during recovery and drills; team-specific processes; and an assessed simulated event. Four audiences take different subsets: decision, technical, business and awareness. Every role holder, primary and deputy, retakes their subset within twelve months of last completion and never later than twelve months after appointment, with an additional briefing within thirty days of any material plan change, and a syllabus review annually, after every drill's lessons-learned session, after any invocation and on any audit finding. New joiners complete the path within thirty calendar days of appointment and before their first on-call shift or first sole holding of the role, whichever comes first, and until then they are in training, may shadow, and a trained primary or deputy stays reachable. Assessment is closed book: the trainee answers with nothing open and each item is scored unprompted, prompted or missed; every item unprompted is a pass, one prompted is a pass with a re-check at the next quarterly drill, and any missed item or two prompted is a fail and a repeat within fourteen days. Drill participation never discharges the new-joiner path."
mutation = "governance.training_programme ANSWERED confidence=high provenance=document:oci-itscp/checklists/contingency-training.md"
notes = "The reference plan records its own intervals, the twelve-month refresher, the thirty-day new-joiner deadline, the thirty-day briefing window and the fourteen-day re-test, as organisation-defined values for assignments the standard leaves open, and states that no source prescribes them. The training register itself is not populated in the example repository. No interview took place and no draft was read back to anybody. The read-back is recorded as confirmed because the store requires one on this question; the value is quoted from the cited file rather than drafted on someone's behalf."

