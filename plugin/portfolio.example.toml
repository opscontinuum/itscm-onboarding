# portfolio.toml - the register of systems, what they need, and the order they
# recover in. Generated and regenerated by itscp-portfolio; comments come from the
# schema, so edits to them are overwritten on the next write.
#
# A per-system plan can be correct on its own and impossible in company. This file
# is where that is checked: run itscp_portfolio.validate to find recovery time
# inversions, dependency cycles and wave ordering the individual plans cannot see.

schema_version = 1
organisation = "Example Corp"

# How many systems each tier may hold. Asked in isolation every owner says
# tier 0; the budget is what makes the ranking comparative.
[tier_budget]
"0" = 4
"1" = 5
"2" = 4
"3" = 4

# The recovery order. max_concurrent is how many of a wave's systems can actually
# be recovered at once, which is a statement about people more often than capacity.

[[wave]]
id = 0
name = "Foundation"
purpose = "Network and identity. Nothing else can be reached, or logged in to, until these are back."
max_concurrent = 2

[[wave]]
id = 1
name = "Secrets and recovery tooling"
purpose = "The systems the recovery itself depends on: credentials, runbooks, deployment artefacts. Left out of most plans, and needed by all of them."
max_concurrent = 3

[[wave]]
id = 2
name = "Core systems of record"
purpose = "The systems everything else reads from."
max_concurrent = 2

[[wave]]
id = 3
name = "Dependent applications and public interfaces"
purpose = "Applications built on the core, and the interfaces clients reach."
max_concurrent = 4

[[wave]]
id = 4
name = "Supporting and internal tooling"
purpose = "Internal tooling and reporting that can wait a day."
max_concurrent = 6

# One block per system. class is one of: shared-platform, core-data, dependent-app, supporting-infra, public-api, public-web.
# depends_on.kind is one of: runtime, recovery, data. A recovery
# dependency is what the system needs in order to BE recovered, which is the
# question almost nobody asks and the one that finds circular plans.

[[system]]
slug = "network-core"
name = "Core network and cross-region peering"
class = "shared-platform"
business_owner = "Head of Infrastructure"
application_owner = "Network lead"
tier = 0
rto = "15m"
rpo = "0"
mtd = "1h"
wave = 0
plan_repo = "https://github.com/example-corp/itscp-network-core"

[[system]]
slug = "okta-idp"
name = "Identity provider"
class = "shared-platform"
business_owner = "Head of Security"
application_owner = "Identity platform lead"
tier = 0
rto = "30m"
rpo = "0"
mtd = "1h"
wave = 0
plan_repo = "https://github.com/example-corp/itscp-okta-idp"
notes = "Recovering anything else requires logging in to the cloud console, which authenticates here. It is first for that reason, not because it is the most valuable."

[[system.depends_on]]
on = "network-core"
kind = "runtime"
criticality = "hard"

[[system]]
slug = "vault-secrets"
name = "Secrets and certificate store"
class = "shared-platform"
business_owner = "Head of Security"
application_owner = "Identity platform lead"
tier = 0
rto = "30m"
rpo = "0"
mtd = "2h"
wave = 1
plan_repo = "https://github.com/example-corp/itscp-vault-secrets"

[[system.depends_on]]
on = "network-core"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "okta-idp"
kind = "runtime"
criticality = "hard"

[[system]]
slug = "gitlab"
name = "Source control and runbook store"
class = "supporting-infra"
business_owner = "Head of Engineering"
application_owner = "Developer platform lead"
tier = 1
rto = "1h"
rpo = "1h"
mtd = "4h"
wave = 1
plan_repo = "https://github.com/example-corp/itscp-gitlab"
notes = "Every runbook in the estate is stored here. That makes it a recovery dependency of almost everything, which is why it recovers in wave 1 rather than with the other internal tooling in wave 4."

[[system.depends_on]]
on = "okta-idp"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "vault-secrets"
kind = "runtime"
criticality = "hard"

[[system]]
slug = "nexus"
name = "Artefact repository"
class = "supporting-infra"
business_owner = "Head of Engineering"
application_owner = "Developer platform lead"
tier = 2
rto = "2h"
rpo = "4h"
mtd = "12h"
wave = 1
plan_repo = "https://github.com/example-corp/itscp-nexus"
notes = "Deployments pull artefacts from here, so any system rebuilt rather than failed over needs it before it can be rebuilt."

[[system.depends_on]]
on = "okta-idp"
kind = "runtime"
criticality = "hard"

[[system]]
slug = "id-database"
name = "Identity and entitlement database"
class = "core-data"
business_owner = "Chief People Officer"
application_owner = "Identity platform lead"
tier = 0
rto = "2h"
rpo = "0"
mtd = "4h"
wave = 2
plan_repo = "https://github.com/example-corp/itscp-id-database"

[[system.depends_on]]
on = "okta-idp"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "vault-secrets"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "gitlab"
kind = "recovery"
criticality = "hard"
notes = "The failover runbook for this database is a GitLab repository."

[[system]]
slug = "hr-core"
name = "HR core suite"
class = "core-data"
business_owner = "Chief People Officer"
application_owner = "HR systems lead"
tier = 1
rto = "4h"
rpo = "15m"
mtd = "8h"
wave = 2
plan_repo = "https://github.com/example-corp/itscp-hr-core"

[[system.depends_on]]
on = "id-database"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "gitlab"
kind = "recovery"
criticality = "hard"

[[system]]
slug = "payroll"
name = "Payroll"
class = "dependent-app"
business_owner = "Payroll Manager"
application_owner = "HR systems lead"
tier = 1
rto = "8h"
rpo = "15m"
mtd = "24h"
wave = 3
plan_repo = "https://github.com/example-corp/itscp-payroll"
notes = "Time dependent: the tolerance is days outside a pay run and hours inside one. The register carries the worst case; docs/02 in its own plan carries the mechanism."

[[system.depends_on]]
on = "hr-core"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "id-database"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "nexus"
kind = "recovery"
criticality = "hard"

[[system]]
slug = "benefits-portal"
name = "Benefits self-service portal"
class = "dependent-app"
business_owner = "Head of Reward"
application_owner = "HR systems lead"
tier = 2
rto = "8h"
rpo = "4h"
mtd = "24h"
wave = 3
plan_repo = "https://github.com/example-corp/itscp-benefits-portal"

[[system.depends_on]]
on = "hr-core"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "id-database"
kind = "runtime"
criticality = "hard"

[[system]]
slug = "client-ingest-api"
name = "Client data ingest API"
class = "public-api"
business_owner = "Head of Client Operations"
application_owner = "Integration lead"
tier = 1
rto = "4h"
rpo = "0"
mtd = "8h"
wave = 3
plan_repo = "https://github.com/example-corp/itscp-client-ingest-api"
notes = "RPO 0 because a client that has already POSTed a payload considers it delivered. Unlike an internal batch, there is no upstream system holding a copy to resend from."

[[system.depends_on]]
on = "id-database"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "gitlab"
kind = "recovery"
criticality = "hard"

[[system]]
slug = "partner-sso"
name = "Partner single sign-on"
class = "public-api"
business_owner = "Head of Client Operations"
application_owner = "Identity platform lead"
tier = 1
rto = "4h"
rpo = "0"
mtd = "8h"
wave = 3
plan_repo = "https://github.com/example-corp/itscp-partner-sso"

[[system.depends_on]]
on = "okta-idp"
kind = "runtime"
criticality = "hard"

[[system.depends_on]]
on = "id-database"
kind = "runtime"
criticality = "hard"

[[system]]
slug = "jira"
name = "Ticketing"
class = "supporting-infra"
business_owner = "Head of Engineering"
application_owner = "Developer platform lead"
tier = 3
rto = "24h"
rpo = "8h"
mtd = "72h"
wave = 4
plan_repo = "https://github.com/example-corp/itscp-jira"

[[system.depends_on]]
on = "okta-idp"
kind = "runtime"
criticality = "hard"

[[system]]
slug = "www-marketing"
name = "Public website"
class = "public-web"
business_owner = "Head of Marketing"
application_owner = "Web lead"
tier = 2
rto = "12h"
rpo = "24h"
mtd = "48h"
wave = 4
plan_repo = "https://github.com/example-corp/itscp-www-marketing"
notes = "No hard dependency on the estate: it is statically published. The exposure is reputational, not transactional, which is why a tier 2 site sits beside tier 1 applications."

[[system]]
slug = "analytics"
name = "Reporting and analytics"
class = "dependent-app"
business_owner = "Head of Finance"
application_owner = "Data lead"
tier = 3
rto = "24h"
rpo = "24h"
mtd = "72h"
wave = 4
plan_repo = ""
notes = "In the register with no plan yet. A system the organisation knows it has and has not planned for is a finding, not an omission."

[[system.depends_on]]
on = "hr-core"
kind = "data"
criticality = "soft"

[[system.depends_on]]
on = "id-database"
kind = "data"
criticality = "soft"
